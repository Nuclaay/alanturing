```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turing Escape</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    background:#222;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:22px;
    z-index:10;
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    text-align:center;
    display:none;
    background:rgba(0,0,0,0.8);
    padding:20px;
    border-radius:10px;
}
</style>
</head>
<body>

<div id="hud">
Vida: <span id="life">100</span><br>
Nivel: <span id="level">1</span><br>
Puntos: <span id="score">0</span>
</div>

<div id="message"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const lifeText = document.getElementById("life");
const levelText = document.getElementById("level");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let keys = {};
let bullets = [];
let gameOver = false;
let waitingNextQuestion = false;
let wrongAnswerCooldown = false;

let score = 0;
let level = 1;
const maxLevel = 10;

const player = {
    x: canvas.width / 2,
    y: canvas.height - 150,
    size: 35,
    speed: 5,
    life: 100
};

const questions = [
{
question:"¿Quién creó la máquina de Turing?",
answers:["Albert Einstein","Alan Turing","Isaac Newton","Nikola Tesla"],
correct:1
},
{
question:"¿Qué máquina ayudó a descifrar Turing?",
answers:["Windows","Enigma","Google","Linux"],
correct:1
},
{
question:"¿Qué significa IA?",
answers:["Internet Artificial","Información Automática","Inteligencia Artificial","Inteligencia Avanzada"],
correct:2
},
{
question:"¿La máquina de Turing aprendía sola?",
answers:["Sí","No","A veces","Solo con internet"],
correct:1
},
{
question:"¿Qué hacía Enigma?",
answers:["Cifraba mensajes","Tomaba fotos","Hacía música","Construía robots"],
correct:0
},
{
question:"¿Qué propuso Alan Turing?",
answers:["El Test de Turing","Facebook","WiFi","GPS"],
correct:0
}
];

let currentQuestion = 0;
let options = [];
let lavaHeight = 0;

function setupQuestion(){

    const q = questions[currentQuestion];
    options = [];

    const width = canvas.width / 4;

    for(let i = 0; i < 4; i++){

        options.push({
            x: i * width + 20,
            y: 130,
            width: width - 40,
            height: 100,
            text: q.answers[i],
            correct: i === q.correct
        });
    }

    bullets = [];
}

setupQuestion();

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

function spawnBullet(){

    bullets.push({
        x: Math.random() * canvas.width,
        y: -20,
        size: 12,
        speed: 8 + level * 1.2
    });
}

setInterval(()=>{

    if(!gameOver && !waitingNextQuestion){

        // más proyectiles
        spawnBullet();
        spawnBullet();

        // desde nivel 4 aparecen más
        if(level >= 4){
            spawnBullet();
        }

        // desde nivel 7 todavía más
        if(level >= 7){
            spawnBullet();
        }
    }

}, Math.max(150, 450 - level * 25));

function movePlayer(){

    if(keys["w"] || keys["arrowup"]) player.y -= player.speed;
    if(keys["s"] || keys["arrowdown"]) player.y += player.speed;
    if(keys["a"] || keys["arrowleft"]) player.x -= player.speed;
    if(keys["d"] || keys["arrowright"]) player.x += player.speed;

    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
}

function nextQuestion(){

    level++;
    lavaHeight = 0;

    if(level > maxLevel){
        winGame();
        return;
    }

    currentQuestion =
    Math.floor(Math.random() * questions.length);

    setupQuestion();

    waitingNextQuestion = false;
    message.style.display = "none";
}

function update(){

    if(gameOver) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    movePlayer();

    // Lava
    if(!waitingNextQuestion){
        lavaHeight += 0.55 + (level * 0.12);
    }

    ctx.fillStyle = "red";
    ctx.fillRect(
        0,
        canvas.height - lavaHeight,
        canvas.width,
        lavaHeight
    );

    if(player.y + player.size >
       canvas.height - lavaHeight){

        player.life -= 0.3;
    }

    // Pregunta
    ctx.fillStyle = "white";
    ctx.font = "28px Arial";
    ctx.fillText(
        questions[currentQuestion].question,
        40,
        60
    );

    // Opciones
    options.forEach(option=>{

        // TODAS iguales (sin marcar correcta)
        ctx.fillStyle = "#444";

        ctx.fillRect(
            option.x,
            option.y,
            option.width,
            option.height
        );

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";

        ctx.fillText(
            option.text,
            option.x + 10,
            option.y + 55
        );

        const touching =
        player.x < option.x + option.width &&
        player.x + player.size > option.x &&
        player.y < option.y + option.height &&
        player.y + player.size > option.y;

        if(
            touching &&
            !waitingNextQuestion
        ){

            if(option.correct){

                waitingNextQuestion = true;
                score += 100;

                message.style.display = "block";
                message.innerHTML =
                "✅ CORRECTO<br><br>" +
                "Siguiente pregunta en 2 segundos";

                setTimeout(()=>{
                    nextQuestion();
                },2000);

            }else if(!wrongAnswerCooldown){

                wrongAnswerCooldown = true;
                player.life -= 20;

                setTimeout(()=>{
                    wrongAnswerCooldown = false;
                },1200);
            }
        }
    });

    // Balas
    bullets.forEach((bullet,index)=>{

        bullet.y += bullet.speed;

        ctx.fillStyle = "yellow";
        ctx.beginPath();
        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.size,
            0,
            Math.PI * 2
        );
        ctx.fill();

        const hit =
        player.x < bullet.x + bullet.size &&
        player.x + player.size > bullet.x &&
        player.y < bullet.y + bullet.size &&
        player.y + player.size > bullet.y;

        if(hit){

            player.life -= 40;
            bullets.splice(index,1);
        }

        if(bullet.y > canvas.height){
            bullets.splice(index,1);
        }
    });

    // Jugador
    ctx.fillStyle = "cyan";
    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    // HUD
    lifeText.textContent =
    Math.max(0, Math.floor(player.life));

    levelText.textContent = level;
    scoreText.textContent = score;

    if(player.life <= 0){
        endGame();
        return;
    }

    requestAnimationFrame(update);
}

function endGame(){

    gameOver = true;

    message.style.display = "block";
    message.innerHTML = `
    💀 GAME OVER<br><br>
    Puntos: ${score}<br>
    Nivel alcanzado: ${level}<br><br>
    <button onclick="location.reload()">
    Reiniciar
    </button>
    `;
}

function winGame(){

    gameOver = true;

    message.style.display = "block";
    message.innerHTML = `
    🏆 ¡GANASTE!<br><br>
    Superaste todos los niveles<br>
    Puntos: ${score}<br><br>
    <button onclick="location.reload()">
    Jugar otra vez
    </button>
    `;
}

update();
</script>

</body>
</html>
