<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turing Escape</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    background:#222;
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:22px;
    z-index:10;
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    text-align:center;
    display:none;
    background:rgba(0,0,0,0.8);
    padding:20px;
    border-radius:10px;
}
</style>
</head>
<body>

<div id="hud">
Vida: <span id="life">100</span><br>
Nivel: <span id="level">1</span><br>
Puntos: <span id="score">0</span>
</div>

<div id="message"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
    
canvas.setAttribute("tabindex", "0");
canvas.focus();

const lifeText = document.getElementById("life");
const levelText = document.getElementById("level");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let keys = {};
let gameOver = false;
let waitingNextQuestion = false;
let wrongAnswerCooldown = false;

let score = 0;
let level = 1;
let maxLevel = 10;

const player = {
    x: canvas.width / 2,
    y: canvas.height - 150,
    size: 35,
    speed: 5,
    life: 100
};

const questions = [
{

question:"¿En qué guerra ayudó Alan Turing?",
answers:[
"Primera Guerra Mundial",
"Segunda Guerra Mundial",
"Guerra Fría",
"Guerra Civil"
],
correct:1
},
{
question:"¿Qué buscaba probar el Test de Turing?",
answers:[
"Si una máquina parece humana",
"Velocidad de internet",
"Seguridad informática",
"Temperatura de computadoras"
],
correct:0
},
{
question:"¿Qué hacía Enigma?",
answers:[
"Cifraba mensajes",
"Creaba videojuegos",
"Tomaba fotos",
"Hacía llamadas"
],
correct:0
},
{
question:"¿Qué usa la IA para aprender?",
answers:[
"Datos",
"Gasolina",
"Electricidad solar",
"Plástico"
],
correct:0
},
{
question:"¿Quién creó la máquina de Turing?",
answers:["Albert Einstein","Alan Turing","Isaac Newton","Nikola Tesla"],
correct:1
},
{
question:"¿Qué máquina ayudó a descifrar Turing?",
answers:["Windows","Enigma","Google","Linux"],
correct:1
},
{
question:"¿Qué significa IA?",
answers:["Internet Artificial","Información Automática","Inteligencia Artificial","Inteligencia Avanzada"],
correct:2
},
{
question:"¿La máquina de Turing aprendía sola?",
answers:["Sí","No","A veces","Solo con internet"],
correct:1
},
{
question:"¿Qué hacía Enigma?",
answers:["Cifraba mensajes","Tomaba fotos","Hacía música","Construía robots"],
correct:0
},
{
question:"¿Qué propuso Alan Turing?",
answers:["El Test de Turing","Facebook","WiFi","GPS"],
correct:0
}
];
    
maxLevel = questions.length;

let currentQuestion = 0;
let options = [];
    
setupQuestion();

window.addEventListener("keydown", function(e){
    keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", function(e){
    keys[e.key.toLowerCase()] = false;
});
    

function setupQuestion(){

    // seguridad para evitar errores
    if(currentQuestion >= questions.length){
        winGame();
        return;
    }

    const q = questions[currentQuestion];
    options = [];

    const width = canvas.width / 4;

    for(let i = 0; i < 4; i++){

        options.push({
            x: i * width + 20,
            y: 130,
            width: width - 40,
            height: 100,
            text: q.answers[i],
            correct: i === q.correct
        });
    }
}
    

function movePlayer(){

    if(keys["w"] || keys["arrowup"]){
        player.y -= player.speed;
    }

    if(keys["s"] || keys["arrowdown"]){
        player.y += player.speed;
    }

    if(keys["a"] || keys["arrowleft"]){
        player.x -= player.speed;
    }

    if(keys["d"] || keys["arrowright"]){
        player.x += player.speed;
    }

    player.x = Math.max(
        0,
        Math.min(canvas.width - player.size, player.x)
    );

    player.y = Math.max(
        0,
        Math.min(canvas.height - player.size, player.y)
    );
}

function nextQuestion(){

    level++;

    // siguiente pregunta
    currentQuestion++;

    // verificar si terminó el juego
    if(currentQuestion >= questions.length){
        winGame();
        return;
    }

    setupQuestion();


    waitingNextQuestion = false;
    message.style.display = "none";
}

function update(){

    if(gameOver) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    movePlayer();

    // Pregunta
ctx.fillStyle = "white";
ctx.font = "30px Arial";
ctx.textAlign = "center";

if(questions[currentQuestion]){

    ctx.fillText(
        questions[currentQuestion].question,
        canvas.width / 2,
        60
    );
}

ctx.textAlign = "left";

    // Opciones
    options.forEach(option=>{

        // TODAS iguales (sin marcar correcta)
        ctx.fillStyle = "#444";

        ctx.fillRect(
            option.x,
            option.y,
            option.width,
            option.height
        );

        ctx.fillStyle = "white";
        ctx.font = "18px Arial";

        ctx.fillText(
            option.text,
            option.x + 10,
            option.y + 55
        );

        const touching =
        player.x < option.x + option.width &&
        player.x + player.size > option.x &&
        player.y < option.y + option.height &&
        player.y + player.size > option.y;

        if(
            touching &&
            !waitingNextQuestion
        ){

            if(option.correct){

                waitingNextQuestion = true;
                score += 100;

                message.style.display = "block";
                message.innerHTML =
                "✅ CORRECTO<br><br>" +
                "Siguiente pregunta en 2 segundos";

                setTimeout(()=>{
                    nextQuestion();
                },2000);

            }else if(!wrongAnswerCooldown){

                wrongAnswerCooldown = true;
                    player.life -= 20; 
                }

                setTimeout(()=>{
                    wrongAnswerCooldown = false;
                },1200);
            }
        }
    });

  
    // Jugador
    ctx.fillStyle = "cyan";
    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    // HUD
    lifeText.textContent =
    Math.max(0, Math.floor(player.life));

    levelText.textContent = level;
    scoreText.textContent = score;

    if(player.life <= 0){
        endGame();
        return;
    }

    requestAnimationFrame(update);
}

function endGame(){

    gameOver = true;

    message.style.display = "block";
    message.innerHTML = `
    💀 GAME OVER<br><br>
    Puntos: ${score}<br>
    Nivel alcanzado: ${level}<br><br>
    <button onclick="location.reload()">
    Reiniciar
    </button>
    `;
}

function winGame(){

    gameOver = true;

    message.style.display = "block";
    message.innerHTML = `
    🏆 ¡GANASTE!<br><br>
    Superaste todos los niveles<br>
    Puntos: ${score}<br><br>
    <button onclick="location.reload()">
    Jugar otra vez
    </button>
    `;
}

update();
</script>

</body>
</html>
