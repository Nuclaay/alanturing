```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turing Shooter - Enigma & IA</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    color:#00ff00;
    font-family:Courier New, monospace;
}

canvas{
    display:block;
    background:
    radial-gradient(circle at center, #111 0%, #000 80%);
}

#hud{
    position:absolute;
    top:10px;
    left:10px;
    font-size:20px;
    z-index:2;
}

#questionBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:black;
    border:3px solid #00ff00;
    padding:20px;
    display:none;
    width:400px;
    z-index:3;
}

button{
    background:#111;
    color:#00ff00;
    border:2px solid #00ff00;
    padding:10px;
    margin:5px;
    cursor:pointer;
    width:100%;
}

button:hover{
    background:#00ff00;
    color:black;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:none;
    color:red;
    font-size:50px;
    text-align:center;
}
</style>
</head>

<body>

<div id="hud">
    Puntos: <span id="score">0</span>
    | Vida: <span id="life">100</span>
</div>

<div id="questionBox">
    <h2>PREGUNTA DE CÓDIGO</h2>
    <p id="questionText"></p>
    <div id="answers"></div>
</div>

<div id="gameOver">
    GAME OVER
    <br>
    <button onclick="location.reload()">Reiniciar</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let life = 100;
let gameRunning = true;

const scoreText = document.getElementById("score");
const lifeText = document.getElementById("life");

const player = {
    x: canvas.width/2,
    y: canvas.height-100,
    size: 30,
    speed: 5
};

const keys = {};
const bullets = [];
const enemies = [];

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){
        bullets.push({
            x: player.x,
            y: player.y,
            size: 6
        });
    }
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

function spawnEnemy(){
    enemies.push({
        x: Math.random()*canvas.width,
        y: -20,
        size: 25,
        speed: 2 + Math.random()*2
    });
}

setInterval(()=>{
    if(gameRunning) spawnEnemy();
},1000);

function movePlayer(){
    if(keys["w"] || keys["arrowup"]) player.y -= player.speed;
    if(keys["s"] || keys["arrowdown"]) player.y += player.speed;
    if(keys["a"] || keys["arrowleft"]) player.x -= player.speed;
    if(keys["d"] || keys["arrowright"]) player.x += player.speed;

    player.x = Math.max(0, Math.min(canvas.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height, player.y));
}

const questions = [
{
q:"¿Quién creó la máquina de Turing?",
a:["Alan Turing","Einstein","Tesla"],
correct:0
},
{
q:"¿Qué máquina ayudó a descifrar Turing?",
a:["Enigma","Windows","Google"],
correct:0
},
{
q:"¿Qué significa IA?",
a:["Inteligencia Artificial","Internet Avanzado","Información Automática"],
correct:0
},
{
q:"¿La máquina de Turing aprendía sola?",
a:["No","Sí","A veces"],
correct:0
},
{
q:"¿Qué hacía Enigma?",
a:["Cifraba mensajes","Tomaba fotos","Hacía música"],
correct:0
}
];

function askQuestion(){
    gameRunning = false;

    const q = questions[Math.floor(Math.random()*questions.length)];

    document.getElementById("questionText").textContent = q.q;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    q.a.forEach((ans,index)=>{
        const btn = document.createElement("button");
        btn.textContent = ans;

        btn.onclick = ()=>{
            if(index === q.correct){
                score += 20;
                alert("¡Correcto! +20 puntos");
            }else{
                life -= 20;
                alert("Incorrecto -20 vida");
            }

            scoreText.textContent = score;
            lifeText.textContent = life;

            document.getElementById("questionBox").style.display = "none";
            gameRunning = true;
        };

        answersDiv.appendChild(btn);
    });

    document.getElementById("questionBox").style.display = "block";
}

function update(){

    if(!gameRunning){
        requestAnimationFrame(update);
        return;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    movePlayer();

    // jugador
    ctx.fillStyle="#00ff00";
    ctx.fillRect(
        player.x-player.size/2,
        player.y-player.size/2,
        player.size,
        player.size
    );

    // balas
    for(let i=bullets.length-1;i>=0;i--){
        bullets[i].y -= 8;

        ctx.fillStyle="yellow";
        ctx.fillRect(
            bullets[i].x,
            bullets[i].y,
            bullets[i].size,
            bullets[i].size
        );

        if(bullets[i].y<0){
            bullets.splice(i,1);
        }
    }

    // enemigos
    for(let i=enemies.length-1;i>=0;i--){

        enemies[i].y += enemies[i].speed;

        ctx.fillStyle="red";
        ctx.fillRect(
            enemies[i].x,
            enemies[i].y,
            enemies[i].size,
            enemies[i].size
        );

        // colision bala
        for(let j=bullets.length-1;j>=0;j--){

            let dx = bullets[j].x - enemies[i].x;
            let dy = bullets[j].y - enemies[i].y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 25){
                enemies.splice(i,1);
                bullets.splice(j,1);

                score += 10;
                scoreText.textContent = score;

                if(score % 50 === 0){
                    askQuestion();
                }

                break;
            }
        }

        // enemigo toca jugador
        let dx = player.x - enemies[i].x;
        let dy = player.y - enemies[i].y;
        let dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 35){
            enemies.splice(i,1);
            life -= 10;
            lifeText.textContent = life;
        }
    }

    if(life <= 0){
        gameRunning = false;
        document.getElementById("gameOver").style.display="block";
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
